[package]
name = "s1_v2_datafusion"
version = "0.1.0"
edition = "2021"

[dependencies]
s1_v2_rust = { path = "../s1_v2_rust" }
datafusion = { version = "55.3", default-features = false, features = ["sql"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
